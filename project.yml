name: Current
options:
  bundleIdPrefix: com.currentreader
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Current:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.currentreader.Current
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Current
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: [remote-notification]
        TARGETED_DEVICE_FAMILY: '1,2'
    entitlements:
      path: App/Current.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.currentreader.Current]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    scheme:
      gatherCoverageData: false
